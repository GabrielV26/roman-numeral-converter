<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de números romanos</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("data-form");
            const result = document.getElementById("resultado");

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                result.textContent = "Convertendo...";

                try {
                    const response = await fetch("{% url 'converter' %}", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                            "X-Requested-With": "XMLHttpRequest"
                        },
                        body: new URLSearchParams(new FormData(form))
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.erro || "Não foi possível converter o valor.");
                    }
                    result.textContent = data.resultado;
                } catch (error) {
                    result.textContent = error.message || "Ocorreu um erro inesperado.";
                }
            });
        });
    </script>
</head>
<body>
    <main class="container">
        <h1>Conversor de números romanos</h1>
        <section class="form-container">
            <form id="data-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Converter</button>
            </form>
            <p id="resultado" class="result" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
